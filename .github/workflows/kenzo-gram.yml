      - name: Build the app (long step, about 1 to 2 hours)
        run: |
          set -o pipefail
          cd tg
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g" :TMessagesProj_App:assembleAfatRelease 2>&1 | tee -a ../build.log

      - name: Collect the APK
        run: |
          APK="$(find tg/TMessagesProj_App/build/outputs/apk -name '*.apk' | grep -i release | head -1)"
          if [ -z "$APK" ]; then echo "PATCH-ERROR: apk not found" | tee -a build.log; find tg -name '*.apk'; exit 1; fi
          ls -la "$APK"
          cp "$APK" KenzOGram.apk

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "tg-${{ github.run_number }}" KenzOGram.apk --repo "$GITHUB_REPOSITORY" --title "KenzO Gram ${{ github.run_number }}" --notes "KenzO Gram build" --target "${{ github.sha }}"

      - name: Show the problem
        if: failure()
        run: |
          {
            echo "## Build failed"
            echo '```'
            if [ -f build.log ]; then grep -nE "PATCH-ERROR|error:|FAILED|What went wrong|Execution failed|Could not|No space left|OutOfMemory|fatal:" build.log | tail -40; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
