name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: |
          set -e
          mkdir -p kb
          cd kb
          mkdir -p .
          cat > settings.gradle <<'EOF_0'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NumKeyboard"
          include ':app'
          EOF_0
          mkdir -p app
          cat > app/build.gradle <<'EOF_1'
          plugins {
              id 'com.android.application' version '8.5.2'
          }

          android {
              namespace 'com.example.numkeyboard'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.numkeyboard"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
                  encoding 'UTF-8'
              }
          }
          EOF_1
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_2'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="كيبورد الخانات"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".NumKeyboardService"
                      android:exported="true"
                      android:label="كيبورد الخانات"
                      android:permission="android.permission.BIND_INPUT_METHOD">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data
                          android:name="android.view.im"
                          android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          EOF_2
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/method.xml <<'EOF_3'
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android"
              android:settingsActivity="com.example.numkeyboard.MainActivity" />
          EOF_3
          mkdir -p app/src/main/java/com/example/numkeyboard
          cat > app/src/main/java/com/example/numkeyboard/MainActivity.java <<'EOF_4'
          package com.example.numkeyboard;

          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.view.inputmethod.InputMethodManager;
          import android.widget.Button;
          import android.widget.CompoundButton;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.Switch;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              static final String PREFS = "numkb";
              static final String KEY_GROUPS = "groups";       // عدد الخانات 1..24
              static final String KEY_GROUP_SIZE = "groupSize"; // عدد الأرقام بكل خانة
              static final String KEY_AUTO_SEND = "autoSend";

              private SharedPreferences prefs;
              private TextView summary;
              private TextView groupsLabel;
              private TextView sizeLabel;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = getSharedPreferences(PREFS, MODE_PRIVATE);

                  int pad = dp(20);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(pad, pad, pad, pad);
                  root.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);

                  TextView title = new TextView(this);
                  title.setText("كيبورد الخانات");
                  title.setTextSize(26);
                  title.setTextColor(Color.BLACK);
                  root.addView(title);

                  // عدد الخانات
                  groupsLabel = new TextView(this);
                  groupsLabel.setTextSize(18);
                  groupsLabel.setPadding(0, dp(24), 0, dp(4));
                  root.addView(groupsLabel);

                  SeekBar groupsBar = new SeekBar(this);
                  groupsBar.setMax(23); // 0..23 => 1..24
                  groupsBar.setProgress(prefs.getInt(KEY_GROUPS, 4) - 1);
                  root.addView(groupsBar);

                  // عدد الأرقام بكل خانة
                  sizeLabel = new TextView(this);
                  sizeLabel.setTextSize(18);
                  sizeLabel.setPadding(0, dp(20), 0, dp(4));
                  root.addView(sizeLabel);

                  SeekBar sizeBar = new SeekBar(this);
                  sizeBar.setMax(5); // 0..5 => 1..6
                  sizeBar.setProgress(prefs.getInt(KEY_GROUP_SIZE, 3) - 1);
                  root.addView(sizeBar);

                  // إرسال تلقائي
                  Switch autoSend = new Switch(this);
                  autoSend.setText("إرسال تلقائي عند اكتمال الخانات");
                  autoSend.setTextSize(18);
                  autoSend.setChecked(prefs.getBoolean(KEY_AUTO_SEND, true));
                  autoSend.setPadding(0, dp(20), 0, dp(10));
                  root.addView(autoSend);

                  summary = new TextView(this);
                  summary.setTextSize(16);
                  summary.setTextColor(Color.parseColor("#1565C0"));
                  summary.setPadding(0, dp(10), 0, dp(10));
                  root.addView(summary);

                  Button enable = new Button(this);
                  enable.setText("1) تفعيل الكيبورد");
                  enable.setOnClickListener(v ->
                          startActivity(new Intent(Settings.ACTION_INPUT_METHOD_SETTINGS)));
                  root.addView(enable);

                  Button pick = new Button(this);
                  pick.setText("2) اختيار الكيبورد");
                  pick.setOnClickListener(v -> {
                      InputMethodManager imm =
                              (InputMethodManager) getSystemService(Context.INPUT_METHOD_SERVICE);
                      if (imm != null) imm.showInputMethodPicker();
                  });
                  root.addView(pick);

                  groupsBar.setOnSeekBarChangeListener(new SimpleSeek() {
                      @Override
                      public void onProgressChanged(SeekBar s, int p, boolean user) {
                          prefs.edit().putInt(KEY_GROUPS, p + 1).apply();
                          refresh();
                      }
                  });
                  sizeBar.setOnSeekBarChangeListener(new SimpleSeek() {
                      @Override
                      public void onProgressChanged(SeekBar s, int p, boolean user) {
                          prefs.edit().putInt(KEY_GROUP_SIZE, p + 1).apply();
                          refresh();
                      }
                  });
                  autoSend.setOnCheckedChangeListener((CompoundButton b, boolean on) -> {
                      prefs.edit().putBoolean(KEY_AUTO_SEND, on).apply();
                      refresh();
                  });

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(root);
                  setContentView(scroll);
                  refresh();
              }

              private void refresh() {
                  int groups = prefs.getInt(KEY_GROUPS, 4);
                  int size = prefs.getInt(KEY_GROUP_SIZE, 3);
                  boolean auto = prefs.getBoolean(KEY_AUTO_SEND, true);
                  groupsLabel.setText("عدد الخانات: " + groups);
                  sizeLabel.setText("الأرقام بكل خانة: " + size);
                  summary.setText("المجموع: " + (groups * size) + " رقم"
                          + (auto ? " — يرسل تلقائي لما تكمل." : " — بدون إرسال تلقائي."));
              }

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density);
              }

              private abstract static class SimpleSeek implements SeekBar.OnSeekBarChangeListener {
                  @Override public void onStartTrackingTouch(SeekBar s) { }
                  @Override public void onStopTrackingTouch(SeekBar s) { }
              }
          }
          EOF_4
          mkdir -p app/src/main/java/com/example/numkeyboard
          cat > app/src/main/java/com/example/numkeyboard/NumKeyboardService.java <<'EOF_5'
          package com.example.numkeyboard;

          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.inputmethodservice.InputMethodService;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.inputmethod.EditorInfo;
          import android.view.inputmethod.InputConnection;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class NumKeyboardService extends InputMethodService {

              private SharedPreferences prefs;
              private TextView status;
              private int typed = 0; // كم رقم انكتب لحد الآن

              private final Handler handler = new Handler(Looper.getMainLooper());

              @Override
              public void onCreate() {
                  super.onCreate();
                  prefs = getSharedPreferences(MainActivity.PREFS, MODE_PRIVATE);
              }

              @Override
              public View onCreateInputView() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.parseColor("#ECEFF1"));
                  root.setPadding(dp(4), dp(4), dp(4), dp(4));
                  root.setLayoutDirection(View.LAYOUT_DIRECTION_LTR);

                  status = new TextView(this);
                  status.setGravity(Gravity.CENTER);
                  status.setTextSize(15);
                  status.setTextColor(Color.parseColor("#37474F"));
                  status.setPadding(0, dp(4), 0, dp(6));
                  root.addView(status, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT));

                  String[][] rows = {
                          {"1", "2", "3"},
                          {"4", "5", "6"},
                          {"7", "8", "9"},
                          {"⚙", "0", "⌫"}
                  };
                  for (String[] row : rows) {
                      LinearLayout line = new LinearLayout(this);
                      line.setOrientation(LinearLayout.HORIZONTAL);
                      for (String key : row) {
                          line.addView(makeKey(key), new LinearLayout.LayoutParams(
                                  0, dp(56), 1f));
                      }
                      root.addView(line, new LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT));
                  }
                  updateStatus();
                  return root;
              }

              @Override
              public void onStartInputView(EditorInfo info, boolean restarting) {
                  super.onStartInputView(info, restarting);
                  if (!restarting) typed = 0;
                  updateStatus();
              }

              private Button makeKey(final String label) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setTextSize(22);
                  b.setAllCaps(false);
                  b.setTextColor(Color.BLACK);
                  b.setBackgroundColor(Color.WHITE);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, dp(56), 1f);
                  lp.setMargins(dp(3), dp(3), dp(3), dp(3));
                  b.setLayoutParams(lp);
                  b.setOnClickListener(v -> onKey(label));
                  if (label.equals("⌫")) {
                      b.setOnLongClickListener(v -> {
                          clearAll();
                          return true;
                      });
                  }
                  return b;
              }

              private void onKey(String label) {
                  InputConnection ic = getCurrentInputConnection();
                  if (ic == null) return;

                  switch (label) {
                      case "⚙":
                          Intent i = new Intent(this, MainActivity.class);
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(i);
                          return;
                      case "⌫":
                          ic.deleteSurroundingText(1, 0);
                          if (typed > 0) typed--;
                          updateStatus();
                          return;
                      default:
                          ic.commitText(label, 1);
                          typed++;
                          updateStatus();
                          if (typed >= total()) {
                              boolean auto = prefs.getBoolean(MainActivity.KEY_AUTO_SEND, true);
                              typed = 0;
                              if (auto) {
                                  // تأخير صغير حتى يوصل الرقم الأخير للتطبيق قبل الإرسال
                                  handler.postDelayed(this::sendNow, 60);
                              } else {
                                  updateStatus();
                              }
                          }
                  }
              }

              // ضغطة مطولة على المسح: يمسح كل اللي انكتب
              private void clearAll() {
                  InputConnection ic = getCurrentInputConnection();
                  if (ic == null) return;
                  if (typed > 0) ic.deleteSurroundingText(typed, 0);
                  typed = 0;
                  updateStatus();
              }

              private void sendNow() {
                  InputConnection ic = getCurrentInputConnection();
                  if (ic == null) return;
                  // أول محاولة: إجراء الإرسال/الإدخال المعرّف بالحقل
                  if (!sendDefaultEditorAction(true)) {
                      // إذا الحقل ما عنده إجراء، نرسل ضغطة Enter
                      ic.sendKeyEvent(new KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ENTER));
                      ic.sendKeyEvent(new KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_ENTER));
                  }
                  updateStatus();
              }

              private int groups() { return prefs.getInt(MainActivity.KEY_GROUPS, 4); }
              private int groupSize() { return prefs.getInt(MainActivity.KEY_GROUP_SIZE, 3); }
              private int total() { return groups() * groupSize(); }

              private void updateStatus() {
                  if (status == null) return;
                  int size = groupSize();
                  int doneGroups = typed / size;
                  status.setText("الخانات " + doneGroups + "/" + groups()
                          + "   •   الأرقام " + typed + "/" + total());
              }

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density);
              }
          }
          EOF_5
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../NumKeyboard.apk
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" NumKeyboard.apk --title "NumKeyboard ${{ github.run_number }}" --notes "APK" --target "${{ github.sha }}"
