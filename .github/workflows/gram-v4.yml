name: Build The kenzO
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 8G /swapfile || true
          sudo chmod 600 /swapfile || true
          sudo mkswap /swapfile || true
          sudo swapon /swapfile || true
          df -h /
          free -g

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download Telegram source (pinned version)
        run: |
          set -e
          git init tg
          cd tg
          git remote add origin https://github.com/DrKLO/Telegram.git
          git fetch --depth 1 origin f32ffeec763f0bdbf4bec25b52d654f77bff733d
          git checkout FETCH_HEAD
          ok=0
          for i in 1 2 3; do
            if git submodule update --init --recursive --depth 1 --jobs 4; then ok=1; break; fi
            echo "shallow submodule fetch failed, trying full fetch ($i)"
            if git submodule update --init --recursive --jobs 4; then ok=1; break; fi
          done
          if [ "$ok" != "1" ]; then echo "PATCH-ERROR: could not download submodules"; exit 1; fi
          if git submodule status --recursive | grep -q '^-'; then echo "PATCH-ERROR: some submodules are missing"; exit 1; fi
          df -h /

      - name: Install Android SDK parts
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sudo chown -R "$(id -u):$(id -g)" "$SDK"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then SM="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)"; fi
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SM" --sdk_root="$SDK" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > tg/local.properties

      - name: Apply KenzO changes
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          set -o pipefail
          sudo apt-get install -y python3-pil > /dev/null || python3 -m pip install --break-system-packages pillow
          python3 -c "import PIL; print('pillow ok')"
          cat > patch.py <<'PYEOF'
          import base64
          import io
          import json
          import os
          import re
          import sys

          ROOT = sys.argv[1]
          ICON_B64 = open(sys.argv[2]).read().strip()
          APP_ID = os.environ.get("TG_API_ID", "").strip()
          APP_HASH = os.environ.get("TG_API_HASH", "").strip()
          NEW_PACKAGE = "com.kenzo.gram"
          NEW_NAME = "The kenzO"


          def path(*parts):
              return os.path.join(ROOT, *parts)


          def fail(msg):
              print("PATCH-ERROR: " + msg)
              sys.exit(1)


          def read(p):
              with open(p, encoding="utf-8") as f:
                  return f.read()


          def write(p, s):
              with open(p, "w", encoding="utf-8") as f:
                  f.write(s)


          def replace_exact(p, old, new, expected=1):
              s = read(p)
              n = s.count(old)
              if n != expected:
                  fail("%s: expected %d match(es) of %r, found %d" % (p, expected, old, n))
              write(p, s.replace(old, new))


          def replace_regex(p, pattern, repl, expected=1):
              s = read(p)
              matches = re.findall(pattern, s)
              if len(matches) != expected:
                  fail("%s: expected %d match(es) of regex %r, found %d" % (p, expected, pattern, len(matches)))
              write(p, re.sub(pattern, lambda m: repl(m), s))


          # ---------------------------------------------------------------- credentials
          if not APP_ID.isdigit():
              fail("TG_API_ID is missing or not a number. Add it in Settings > Secrets and variables > Actions.")
          if not re.fullmatch(r"[0-9a-fA-F]{32}", APP_HASH):
              fail("TG_API_HASH is missing or is not a 32-character hash. Add it in Settings > Secrets and variables > Actions.")

          build_vars = path("TMessagesProj", "src", "main", "java", "org", "telegram", "messenger", "BuildVars.java")
          replace_regex(build_vars, r"(public static int APP_ID = )\d+;", lambda m: m.group(1) + APP_ID + ";")
          replace_regex(build_vars, r'(public static String APP_HASH = ")[0-9a-fA-F]+(";)', lambda m: m.group(1) + APP_HASH + m.group(2))
          replace_exact(build_vars, "public static boolean CHECK_UPDATES = true;", "public static boolean CHECK_UPDATES = false;")

          # ---------------------------------------------------------------- package name
          props = path("gradle.properties")
          replace_exact(props, "APP_PACKAGE=org.telegram.messenger", "APP_PACKAGE=" + NEW_PACKAGE)
          replace_exact(props, "org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g", "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g")

          gs = path("TMessagesProj_App", "google-services.json")
          s = read(gs)
          if s.count("org.telegram.messenger") < 1:
              fail("google-services.json has no package names to rewrite")
          write(gs, s.replace("org.telegram.messenger", NEW_PACKAGE))
          json.loads(read(gs))  # still valid json

          # ---------------------------------------------------------------- build size / memory
          app_gradle = path("TMessagesProj_App", "build.gradle")
          replace_exact(app_gradle, 'abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"', 'abiFilters "arm64-v8a"', expected=2)
          replace_exact(app_gradle, "minifyEnabled true", "minifyEnabled false", expected=2)
          replace_exact(app_gradle, "shrinkResources true", "shrinkResources false", expected=2)

          lib_gradle = path("TMessagesProj", "build.gradle")
          replace_exact(
              lib_gradle,
              "        externalNativeBuild {\n            cmake {\n                version '3.22.1'",
              "        ndk { abiFilters \"arm64-v8a\" }\n        externalNativeBuild {\n            cmake {\n                version '3.22.1'",
          )

          # ---------------------------------------------------------------- the speed change
          group_call = path("TMessagesProj", "jni", "tgcalls", "tgcalls", "group", "GroupInstanceCustomImpl.cpp")
          replace_exact(
              group_call,
              "audioOptions.audio_jitter_buffer_min_delay_ms = 50;",
              "audioOptions.audio_jitter_buffer_min_delay_ms = 0;\n"
              "            audioOptions.audio_jitter_buffer_max_packets = 30;",
          )

          # ---------------------------------------------------------------- network latency
          sock = path("TMessagesProj", "jni", "tgnet", "ConnectionSocket.cpp")
          replace_exact(sock, "#include <netinet/tcp.h>\n", "#include <netinet/tcp.h>\n#include <netinet/in.h>\n")
          replace_exact(
              sock,
              "    if (setsockopt(socketFd, IPPROTO_TCP, TCP_NODELAY, &yes, sizeof(int))) {\n"
              "        if (LOGS_ENABLED) DEBUG_E(\"connection(%p) set TCP_NODELAY failed\", this);\n"
              "    }\n",
              "    if (setsockopt(socketFd, IPPROTO_TCP, TCP_NODELAY, &yes, sizeof(int))) {\n"
              "        if (LOGS_ENABLED) DEBUG_E(\"connection(%p) set TCP_NODELAY failed\", this);\n"
              "    }\n"
              "    {\n"
              "        // KenzO: default traffic class (DSCP marking disabled after tests)\n"
              "        int tos = 0x00;\n"
              "        if (ipv6) {\n"
              "#ifdef IPV6_TCLASS\n"
              "            setsockopt(socketFd, IPPROTO_IPV6, IPV6_TCLASS, &tos, sizeof(tos));\n"
              "#endif\n"
              "        } else {\n"
              "#ifdef IP_TOS\n"
              "            setsockopt(socketFd, IPPROTO_IP, IP_TOS, &tos, sizeof(tos));\n"
              "#endif\n"
              "        }\n"
              "    }\n",
          )

          kenzo_net = """package org.telegram.messenger;

          import android.app.Activity;
          import android.app.Application;
          import android.content.Context;
          import android.net.wifi.WifiManager;
          import android.os.Build;
          import android.os.Bundle;

          /** KenzO: keeps Wi-Fi in low-latency mode while the app is on screen. */
          public class KenzoNet implements Application.ActivityLifecycleCallbacks {

              private static boolean started;

              private final Context context;
              private WifiManager.WifiLock lock;
              private int resumed;

              public static void start(Application app) {
                  if (started) {
                      return;
                  }
                  started = true;
                  try {
                      app.registerActivityLifecycleCallbacks(new KenzoNet(app));
                  } catch (Throwable ignore) {
                  }
              }

              private KenzoNet(Context context) {
                  this.context = context.getApplicationContext();
              }

              private void acquire() {
                  try {
                      if (lock == null) {
                          WifiManager wm = (WifiManager) context.getSystemService(Context.WIFI_SERVICE);
                          if (wm == null) {
                              return;
                          }
                          int mode = Build.VERSION.SDK_INT >= 29
                                  ? WifiManager.WIFI_MODE_FULL_LOW_LATENCY
                                  : WifiManager.WIFI_MODE_FULL_HIGH_PERF;
                          lock = wm.createWifiLock(mode, "kenzo-lowlatency");
                          lock.setReferenceCounted(false);
                      }
                      if (!lock.isHeld()) {
                          lock.acquire();
                      }
                  } catch (Throwable ignore) {
                  }
              }

              private void release() {
                  try {
                      if (lock != null && lock.isHeld()) {
                          lock.release();
                      }
                  } catch (Throwable ignore) {
                  }
              }

              @Override
              public void onActivityResumed(Activity activity) {
                  resumed++;
                  acquire();
              }

              @Override
              public void onActivityPaused(Activity activity) {
                  resumed--;
                  if (resumed <= 0) {
                      resumed = 0;
                      release();
                  }
              }

              @Override
              public void onActivityCreated(Activity activity, Bundle savedInstanceState) {
              }

              @Override
              public void onActivityStarted(Activity activity) {
              }

              @Override
              public void onActivityStopped(Activity activity) {
              }

              @Override
              public void onActivitySaveInstanceState(Activity activity, Bundle outState) {
              }

              @Override
              public void onActivityDestroyed(Activity activity) {
              }
          }
          """
          write(path("TMessagesProj", "src", "main", "java", "org", "telegram", "messenger", "KenzoNet.java"), kenzo_net)
          replace_exact(
              path("TMessagesProj", "src", "main", "java", "org", "telegram", "messenger", "ApplicationLoader.java"),
              "        super.onCreate();\n\n        // AndroidUtilities must be initialized before FileLog",
              "        super.onCreate();\n        KenzoNet.start(this);\n\n        // AndroidUtilities must be initialized before FileLog",
          )

          # ---------------------------------------------------------------- v2 features
          MSG = path("TMessagesProj", "src", "main", "java", "org", "telegram", "messenger")

          # latency meter -------------------------------------------------------------
          replace_exact(
              path("TMessagesProj", "src", "main", "java", "org", "telegram", "messenger", "KenzoNet.java"),
              "    private static boolean started;",
              """    private static boolean started;

              public static boolean meterOn() {
                  try {
                      return ApplicationLoader.applicationContext.getSharedPreferences("kenzo", Context.MODE_PRIVATE).getBoolean("meter", true);
                  } catch (Throwable e) {
                      return true;
                  }
              }

              public static boolean toggleMeter() {
                  boolean now = !meterOn();
                  try {
                      ApplicationLoader.applicationContext.getSharedPreferences("kenzo", Context.MODE_PRIVATE).edit().putBoolean("meter", now).apply();
                  } catch (Throwable ignore) {
                  }
                  return now;
              }

              public static volatile long lastTap;
              private static final java.util.HashMap<Integer, long[]> marks = new java.util.HashMap<>();

              public static void tap() {
                  lastTap = android.os.SystemClock.elapsedRealtime();
              }

              public static void markSend(int id) {
                  try {
                      synchronized (marks) {
                          if (marks.size() > 200) {
                              marks.clear();
                          }
                          if (!marks.containsKey(id)) {
                              marks.put(id, new long[]{lastTap, android.os.SystemClock.elapsedRealtime(), 0});
                          }
                      }
                  } catch (Throwable ignore) {
                  }
              }

              public static void onAck(int id) {
                  try {
                      synchronized (marks) {
                          long[] m = marks.get(id);
                          if (m != null && m[2] == 0) {
                              m[2] = android.os.SystemClock.elapsedRealtime();
                          }
                      }
                  } catch (Throwable ignore) {
                  }
              }

              public static void onSent(int id) {
                  try {
                      long[] m;
                      synchronized (marks) {
                          m = marks.remove(id);
                      }
                      if (m == null || !meterOn()) {
                          return;
                      }
                      long now = android.os.SystemClock.elapsedRealtime();
                      long prep = m[0] > 0 && m[1] >= m[0] ? m[1] - m[0] : -1;
                      long ack = m[2] > 0 ? m[2] - m[1] : -1;
                      long net = now - m[1];
                      String s = String.format(java.util.Locale.US, "%.2f", net / 1000.0) + " s  net " + net + " ms"
                              + (ack >= 0 ? " | ack " + ack : "")
                              + (prep >= 0 ? " | prep " + prep + " | all " + (now - m[0]) : "");
                      android.widget.Toast.makeText(ApplicationLoader.applicationContext, s, android.widget.Toast.LENGTH_LONG).show();
                  } catch (Throwable ignore) {
                  }
              }""",
          )
          SMH = path("TMessagesProj", "src", "main", "java", "org", "telegram", "messenger", "SendMessagesHelper.java")
          replace_exact(
              SMH,
              "    protected void performSendMessageRequest(final TLObject req, final MessageObject msgObj, final String originalPath, DelayedMessage parentMessage, boolean check, DelayedMessage delayedMessage, Object parentObject, HashMap<String, String> params, boolean scheduled) {\n",
              "    protected void performSendMessageRequest(final TLObject req, final MessageObject msgObj, final String originalPath, DelayedMessage parentMessage, boolean check, DelayedMessage delayedMessage, Object parentObject, HashMap<String, String> params, boolean scheduled) {\n        if (msgObj != null && msgObj.messageOwner != null) {\n            KenzoNet.markSend(msgObj.messageOwner.id);\n        }\n",
          )
          replace_exact(
              SMH,
              "                    if (error == null) {\n                        final int oldId = newMsgObj.id;\n                        final ArrayList<TLRPC.Message> sentMessages = new ArrayList<>();\n                        final String attachPath = newMsgObj.attachPath;\n",
              "                    if (error == null) {\n                        final int oldId = newMsgObj.id;\n                        KenzoNet.onSent(oldId);\n                        final ArrayList<TLRPC.Message> sentMessages = new ArrayList<>();\n                        final String attachPath = newMsgObj.attachPath;\n",
          )

          replace_exact(
              SMH,
              "    public void sendMessage(SendMessageParams sendMessageParams) {\n",
              "    public void sendMessage(SendMessageParams sendMessageParams) {\n        KenzoNet.tap();\n",
          )
          replace_exact(
              SMH,
              "            final int msg_id = newMsgObj.id;\n            AndroidUtilities.runOnUIThread(() -> {\n                newMsgObj.send_state = MessageObject.MESSAGE_SEND_STATE_SENT;\n                getNotificationCenter().postNotificationName(NotificationCenter.messageReceivedByAck, msg_id);",
              "            final int msg_id = newMsgObj.id;\n            KenzoNet.onAck(msg_id);\n            AndroidUtilities.runOnUIThread(() -> {\n                newMsgObj.send_state = MessageObject.MESSAGE_SEND_STATE_SENT;\n                getNotificationCenter().postNotificationName(NotificationCenter.messageReceivedByAck, msg_id);",
          )

          # deleted messages store ------------------------------------------------------
          kenzo_deleted = """package org.telegram.messenger;

          import android.content.ContentValues;
          import android.content.Context;
          import android.database.Cursor;
          import android.database.sqlite.SQLiteOpenHelper;
          import android.text.TextUtils;

          import org.telegram.SQLite.SQLiteCursor;
          import org.telegram.SQLite.SQLiteDatabase;
          import org.telegram.tgnet.NativeByteBuffer;
          import org.telegram.tgnet.TLRPC;

          import java.util.ArrayList;
          import java.util.Locale;

          /** KenzO: remembers ordinary deleted messages (text and a media label). */
          public class KenzoDeleted {

              private static class Helper extends SQLiteOpenHelper {
                  Helper(Context c) {
                      super(c, "kenzo_deleted.db", null, 1);
                  }

                  @Override
                  public void onCreate(android.database.sqlite.SQLiteDatabase db) {
                      db.execSQL("CREATE TABLE IF NOT EXISTS del (acc INTEGER, did INTEGER, mid INTEGER, sender INTEGER, date INTEGER, out INTEGER, kind TEXT, body TEXT, saved INTEGER, PRIMARY KEY (acc, did, mid))");
                  }

                  @Override
                  public void onUpgrade(android.database.sqlite.SQLiteDatabase db, int o, int n) {
                  }
              }

              private static Helper helper;

              private static synchronized Helper h() {
                  if (helper == null) {
                      helper = new Helper(ApplicationLoader.applicationContext);
                  }
                  return helper;
              }

              /** Called on the storage thread just before messages are removed. */
              public static void snapshot(int account, SQLiteDatabase tg, long dialogId, ArrayList<Integer> mids, int mode) {
                  SQLiteCursor c = null;
                  try {
                      if (mode != 0 || mids == null || mids.isEmpty() || mids.size() > 300) {
                          return;
                      }
                      String ids = TextUtils.join(",", mids);
                      if (dialogId != 0) {
                          c = tg.queryFinalized(String.format(Locale.US, "SELECT uid, data, mid FROM messages_v2 WHERE mid IN(%s) AND uid = %d", ids, dialogId));
                      } else {
                          c = tg.queryFinalized(String.format(Locale.US, "SELECT uid, data, mid FROM messages_v2 WHERE mid IN(%s) AND is_channel = 0", ids));
                      }
                      ArrayList<ContentValues> rows = new ArrayList<>();
                      while (c.next()) {
                          long did = c.longValue(0);
                          int mid = c.intValue(2);
                          if (mid <= 0 || DialogObject.isEncryptedDialog(did)) {
                              continue;
                          }
                          NativeByteBuffer data = c.byteBufferValue(1);
                          if (data == null) {
                              continue;
                          }
                          TLRPC.Message m = TLRPC.Message.TLdeserialize(data, data.readInt32(false), false);
                          data.reuse();
                          if (m == null || m.action != null || m.ttl > 0 || MessageObject.isSecretMedia(m)) {
                              continue;
                          }
                          String text = m.message == null ? "" : m.message;
                          String kind = "";
                          if (m.media != null && !(m.media instanceof TLRPC.TL_messageMediaEmpty)) {
                              kind = m.media.getClass().getSimpleName().replace("TL_messageMedia", "");
                          }
                          if (text.length() == 0 && kind.length() == 0) {
                              continue;
                          }
                          ContentValues v = new ContentValues();
                          v.put("acc", account);
                          v.put("did", did);
                          v.put("mid", mid);
                          v.put("sender", MessageObject.getFromChatId(m));
                          v.put("date", m.date);
                          v.put("out", m.out ? 1 : 0);
                          v.put("kind", kind);
                          v.put("body", text);
                          v.put("saved", System.currentTimeMillis());
                          rows.add(v);
                      }
                      c.dispose();
                      c = null;
                      if (!rows.isEmpty()) {
                          android.database.sqlite.SQLiteDatabase db = h().getWritableDatabase();
                          for (ContentValues v : rows) {
                              db.insertWithOnConflict("del", null, v, android.database.sqlite.SQLiteDatabase.CONFLICT_REPLACE);
                          }
                      }
                  } catch (Throwable ignore) {
                      try {
                          if (c != null) {
                              c.dispose();
                          }
                      } catch (Throwable ignore2) {
                      }
                  }
              }

              /** Rows: did, sender, date, out, kind, body. did == 0 means all chats. */
              public static ArrayList<Object[]> list(int account, long did) {
                  ArrayList<Object[]> out = new ArrayList<>();
                  Cursor c = null;
                  try {
                      android.database.sqlite.SQLiteDatabase db = h().getReadableDatabase();
                      if (did != 0) {
                          c = db.rawQuery("SELECT did, sender, date, out, kind, body FROM del WHERE acc = ? AND did = ? ORDER BY saved DESC LIMIT 2000", new String[]{"" + account, "" + did});
                      } else {
                          c = db.rawQuery("SELECT did, sender, date, out, kind, body FROM del WHERE acc = ? ORDER BY saved DESC LIMIT 2000", new String[]{"" + account});
                      }
                      while (c.moveToNext()) {
                          out.add(new Object[]{c.getLong(0), c.getLong(1), c.getLong(2), c.getInt(3), c.getString(4), c.getString(5)});
                      }
                  } catch (Throwable ignore) {
                  } finally {
                      if (c != null) {
                          c.close();
                      }
                  }
                  return out;
              }

              public static void clear(int account, long did) {
                  try {
                      android.database.sqlite.SQLiteDatabase db = h().getWritableDatabase();
                      if (did != 0) {
                          db.execSQL("DELETE FROM del WHERE acc = " + account + " AND did = " + did);
                      } else {
                          db.execSQL("DELETE FROM del WHERE acc = " + account);
                      }
                  } catch (Throwable ignore) {
                  }
              }
          }
          """
          write(path("TMessagesProj", "src", "main", "java", "org", "telegram", "messenger", "KenzoDeleted.java"), kenzo_deleted)

          kenzo_act = """package org.telegram.messenger;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.BaseAdapter;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ListView;
          import android.widget.TextView;
          import android.widget.Toast;

          import org.telegram.tgnet.TLRPC;

          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Date;
          import java.util.Locale;

          /** KenzO: list of deleted messages. */
          public class KenzoDeletedActivity extends Activity {

              private int account;
              private long did;
              private ArrayList<Object[]> items = new ArrayList<>();
              private BaseAdapter adapter;

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }

              private String nameOf(long id) {
                  try {
                      if (id > 0) {
                          TLRPC.User u = MessagesController.getInstance(account).getUser(id);
                          if (u != null) {
                              return UserObject.getUserName(u);
                          }
                      } else if (id < 0) {
                          TLRPC.Chat ch = MessagesController.getInstance(account).getChat(-id);
                          if (ch != null) {
                              return ch.title;
                          }
                      }
                  } catch (Throwable ignore) {
                  }
                  return "" + id;
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  account = getIntent().getIntExtra("account", 0);
                  did = getIntent().getLongExtra("did", 0L);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.BLACK);
                  root.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);

                  TextView title = new TextView(this);
                  title.setText("\\u0627\\u0644\\u0645\\u062d\\u0630\\u0648\\u0641\\u0627\\u062a");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(22);
                  title.setPadding(dp(16), dp(24), dp(16), dp(8));
                  root.addView(title);

                  Button clear = new Button(this);
                  clear.setText("\\u0645\\u0633\\u062d \\u0627\\u0644\\u0643\\u0644");
                  clear.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          new AlertDialog.Builder(KenzoDeletedActivity.this)
                                  .setMessage("\\u0645\\u0633\\u062d \\u0643\\u0644 \\u0627\\u0644\\u0645\\u062d\\u0630\\u0648\\u0641\\u0627\\u062a\\u061f")
                                  .setPositiveButton("\\u0646\\u0639\\u0645", new android.content.DialogInterface.OnClickListener() {
                                      @Override
                                      public void onClick(android.content.DialogInterface d, int w) {
                                          KenzoDeleted.clear(account, did);
                                          reload();
                                      }
                                  })
                                  .setNegativeButton("\\u0644\\u0627", null)
                                  .show();
                      }
                  });
                  root.addView(clear);

                  ListView list = new ListView(this);
                  list.setDividerHeight(1);
                  adapter = new BaseAdapter() {
                      @Override
                      public int getCount() {
                          return items.size();
                      }

                      @Override
                      public Object getItem(int i) {
                          return items.get(i);
                      }

                      @Override
                      public long getItemId(int i) {
                          return i;
                      }

                      @Override
                      public View getView(int i, View convert, ViewGroup parent) {
