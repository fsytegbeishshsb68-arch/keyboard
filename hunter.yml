name: Build KenzO Hunter
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: |
          set -eo pipefail
          mkdir -p kb
          cd kb
          mkdir -p .
          cat > settings.gradle <<'EOF_0'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KenzoHunt"
          include ':app'
          EOF_0
          mkdir -p .
          cat > build.gradle <<'EOF_1'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_1
          mkdir -p .
          cat > gradle.properties <<'EOF_2'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=false
          EOF_2
          mkdir -p app
          cat > app/build.gradle <<'EOF_3'
          plugins {
              id 'com.android.application' version '8.5.2'
          }

          android {
              namespace 'com.kenzo.hunt'
              compileSdk 34

              defaultConfig {
                  applicationId "com.kenzo.hunt"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
                  encoding 'UTF-8'
              }
          }
          EOF_3
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="KenzO Hunter"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".HuntService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />
              </application>
          </manifest>
          EOF_4
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF_5'
          <resources><string name="app_name">KenzO Hunter</string></resources>
          EOF_5
          mkdir -p app/src/main/java/com/kenzo/hunt
          cat > app/src/main/java/com/kenzo/hunt/MainActivity.java <<'EOF_6'
          package com.kenzo.hunt;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.text.InputType;
          import android.view.View;
          import android.widget.Button;
          import android.widget.CheckBox;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              private EditText token, chat, delay;
              private CheckBox[] boxes = new CheckBox[6];
              private TextView stats, found;
              private SharedPreferences sp;
              private final Handler h = new Handler();

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }

              private TextView label(String s) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextColor(Color.WHITE);
                  t.setTextSize(15);
                  t.setPadding(0, dp(12), 0, dp(4));
                  return t;
              }

              private EditText field(String hint, String value) {
                  EditText e = new EditText(this);
                  e.setHint(hint);
                  e.setText(value);
                  e.setTextColor(Color.WHITE);
                  e.setHintTextColor(Color.GRAY);
                  e.setSingleLine(true);
                  e.setLayoutDirection(View.LAYOUT_DIRECTION_LTR);
                  return e;
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  sp = getSharedPreferences("hunt", MODE_PRIVATE);
                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 1);
                  }

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.BLACK);
                  root.setPadding(dp(16), dp(24), dp(16), dp(24));
                  root.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);

                  TextView title = new TextView(this);
                  title.setText("KenzO Hunter");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(26);
                  root.addView(title);

                  root.addView(label("\u062a\u0648\u0643\u0646 \u0627\u0644\u0628\u0648\u062a (\u0645\u0646 BotFather)"));
                  token = field("123456:ABC...", sp.getString("token", ""));
                  root.addView(token);

                  root.addView(label("\u0623\u064a\u062f\u064a \u062d\u0633\u0627\u0628 \u062a\u064a\u0644\u064a\u062c\u0631\u0627\u0645"));
                  chat = field("123456789", sp.getString("chat", ""));
                  chat.setInputType(InputType.TYPE_CLASS_NUMBER | InputType.TYPE_NUMBER_FLAG_SIGNED);
                  root.addView(chat);

                  root.addView(label("\u0627\u0644\u0623\u0646\u0645\u0627\u0637"));
                  String[] names = {"####", "##_##", "##.##",
                          "\u062d\u0631\u0648\u0641 \u0641\u0642\u0637 (4)",
                          "\u062d\u0631\u0648\u0641 \u0648\u0623\u0631\u0642\u0627\u0645 \u0639\u0634\u0648\u0627\u0626\u064a (4)",
                          "aa_aa"};
                  int mask = sp.getInt("mask", 1);
                  for (int i = 0; i < 6; i++) {
                      boxes[i] = new CheckBox(this);
                      boxes[i].setText(names[i]);
                      boxes[i].setTextColor(Color.WHITE);
                      boxes[i].setChecked((mask & (1 << i)) != 0);
                      root.addView(boxes[i]);
                  }

                  root.addView(label("\u0627\u0644\u0645\u0647\u0644\u0629 \u0628\u064a\u0646 \u0643\u0644 \u0641\u062d\u0635 (\u0645\u0644\u064a \u062b\u0627\u0646\u064a\u0629)"));
                  delay = field("1500", "" + sp.getInt("delay", 1500));
                  delay.setInputType(InputType.TYPE_CLASS_NUMBER);
                  root.addView(delay);

                  Button test = new Button(this);
                  test.setText("\u0627\u062e\u062a\u0628\u0627\u0631 \u062a\u064a\u0644\u064a\u062c\u0631\u0627\u0645");
                  test.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          saveAll();
                          stats.setText("...");
                          new Thread(new Runnable() {
                              @Override
                              public void run() {
                                  final String err = HuntService.send(sp.getString("token", "").trim(), sp.getString("chat", "").trim(), "KenzO Hunter test");
                                  h.post(new Runnable() {
                                      @Override
                                      public void run() {
                                          stats.setText(err == null ? "\u062a\u0645 \u0627\u0644\u0625\u0631\u0633\u0627\u0644 \u2713" : "\u062e\u0637\u0623: " + err);
                                      }
                                  });
                              }
                          }).start();
                      }
                  });
                  root.addView(test);

                  Button start = new Button(this);
                  start.setText("\u0627\u0628\u062f\u0623");
                  start.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          saveAll();
                          Intent i = new Intent(MainActivity.this, HuntService.class);
                          if (Build.VERSION.SDK_INT >= 26) {
                              startForegroundService(i);
                          } else {
                              startService(i);
                          }
                      }
                  });
                  root.addView(start);

                  Button stop = new Button(this);
                  stop.setText("\u0623\u0648\u0642\u0641");
                  stop.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          Intent i = new Intent(MainActivity.this, HuntService.class);
                          i.setAction("stop");
                          startService(i);
                      }
                  });
                  root.addView(stop);

                  stats = new TextView(this);
                  stats.setTextColor(Color.GREEN);
                  stats.setTextSize(16);
                  stats.setPadding(0, dp(16), 0, dp(8));
                  root.addView(stats);

                  root.addView(label("\u0627\u0644\u0645\u062a\u0627\u062d\u0629 \u0627\u0644\u0644\u064a \u0644\u0642\u064a\u062a\u0647\u0627"));
                  found = new TextView(this);
                  found.setTextColor(Color.WHITE);
                  found.setTextIsSelectable(true);
                  found.setLayoutDirection(View.LAYOUT_DIRECTION_LTR);
                  root.addView(found);

                  ScrollView sv = new ScrollView(this);
                  sv.setBackgroundColor(Color.BLACK);
                  sv.addView(root);
                  setContentView(sv);
              }

              private void saveAll() {
                  int mask = 0;
                  for (int i = 0; i < 6; i++) {
                      if (boxes[i].isChecked()) {
                          mask |= 1 << i;
                      }
                  }
                  if (mask == 0) {
                      mask = 1;
                      boxes[0].setChecked(true);
                  }
                  int d = 1500;
                  try {
                      d = Integer.parseInt(delay.getText().toString().trim());
                  } catch (Throwable ignore) {
                  }
                  sp.edit().putString("token", token.getText().toString().trim())
                          .putString("chat", chat.getText().toString().trim())
                          .putInt("mask", mask).putInt("delay", Math.max(300, d)).apply();
              }

              private final Runnable tick = new Runnable() {
                  @Override
                  public void run() {
                      String s = (HuntService.running ? "\u2705 " : "\u23f9 ") + HuntService.status
                              + "\n\u0641\u062d\u0635: " + HuntService.checked
                              + "  \u0645\u062a\u0627\u062d: " + HuntService.free
                              + "  \u0645\u0623\u062e\u0648\u0630: " + HuntService.taken
                              + "\n\u063a\u064a\u0631 \u0648\u0627\u0636\u062d: " + HuntService.unknown
                              + "  \u062d\u0638\u0631: " + HuntService.blocked
                              + "\n\u0622\u062e\u0631 \u0648\u0627\u062d\u062f: " + HuntService.last;
                      if (HuntService.running || HuntService.checked > 0) {
                          stats.setText(s);
                      }
                      found.setText(sp.getString("found", ""));
                      h.postDelayed(this, 1000);
                  }
              };

              @Override
              protected void onResume() {
                  super.onResume();
                  h.post(tick);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  h.removeCallbacks(tick);
              }
          }
          EOF_6
          mkdir -p app/src/main/java/com/kenzo/hunt
          cat > app/src/main/java/com/kenzo/hunt/HuntService.java <<'EOF_7'
          package com.kenzo.hunt;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.util.HashSet;
          import java.util.Locale;
          import java.util.Random;

          public class HuntService extends Service {

              public static volatile boolean running;
              public static volatile int checked, free, taken, unknown, blocked;
              public static volatile String last = "";
              public static volatile String status = "";

              static final int FREE = 1, TAKEN = 2, UNKNOWN = 3, BLOCKED = 4;
              static final String UA = "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36";

              private Thread worker;
              private PowerManager.WakeLock wl;

              @Override
              public IBinder onBind(Intent i) {
                  return null;
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && "stop".equals(intent.getAction())) {
                      stopWork();
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  startForegroundNote();
                  if (!running) {
                      running = true;
                      checked = free = taken = unknown = blocked = 0;
                      status = "running";
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "kenzo:hunt");
                      wl.acquire();
                      worker = new Thread(new Runnable() {
                          @Override
                          public void run() {
                              loop();
                          }
                      });
                      worker.start();
                  }
                  return START_STICKY;
              }

              private void startForegroundNote() {
                  String ch = "hunt";
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= 26) {
                      nm.createNotificationChannel(new NotificationChannel(ch, "Hunter", NotificationManager.IMPORTANCE_LOW));
                  }
                  Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this, ch) : new Notification.Builder(this);
                  b.setContentTitle("KenzO Hunter").setContentText("Running").setSmallIcon(android.R.drawable.ic_menu_search);
                  startForeground(7, b.build());
              }

              private void stopWork() {
                  running = false;
                  status = "stopped";
                  try {
                      if (wl != null && wl.isHeld()) {
                          wl.release();
                      }
                  } catch (Throwable ignore) {
                  }
              }

              @Override
              public void onDestroy() {
                  stopWork();
                  super.onDestroy();
              }

              // ------------------------------------------------------------------ main loop
              private void loop() {
                  SharedPreferences sp = getSharedPreferences("hunt", MODE_PRIVATE);
                  String token = sp.getString("token", "").trim();
                  String chat = sp.getString("chat", "").trim();
                  int mask = sp.getInt("mask", 1);
                  int delay = Math.max(300, sp.getInt("delay", 1500));
                  Random rnd = new Random();
                  HashSet<String> seen = new HashSet<String>();
                  int blockedRun = 0;
                  while (running) {
                      try {
                          String name = gen(rnd, mask);
                          if (name == null || seen.contains(name)) {
                              if (seen.size() > 200000) {
                                  seen.clear();
                              }
                              continue;
                          }
                          seen.add(name);
                          int r = check(name);
                          if (r == FREE) {
                              Thread.sleep(1200);
                              r = check(name);
                          }
                          checked++;
                          last = name;
                          if (r == FREE) {
                              free++;
                              blockedRun = 0;
                              save(sp, name);
                              String err = send(token, chat, "FREE: @" + name + "\nhttps://www.tiktok.com/@" + name);
                              if (err != null) {
                                  status = "telegram: " + err;
                              }
                          } else if (r == TAKEN) {
                              taken++;
                              blockedRun = 0;
                          } else if (r == BLOCKED) {
                              blocked++;
                              blockedRun++;
                              status = "blocked, waiting";
                              long wait = Math.min(300000L, 30000L * blockedRun);
                              long end = System.currentTimeMillis() + wait;
                              while (running && System.currentTimeMillis() < end) {
                                  Thread.sleep(500);
                              }
                              status = "running";
                          } else {
                              unknown++;
                          }
                          Thread.sleep(delay);
                      } catch (InterruptedException e) {
                          break;
                      } catch (Throwable t) {
                          unknown++;
                          try {
                              Thread.sleep(2000);
                          } catch (InterruptedException e) {
                              break;
                          }
                      }
                  }
                  running = false;
              }

              private void save(SharedPreferences sp, String name) {
                  String old = sp.getString("found", "");
                  if (old.length() > 20000) {
                      old = old.substring(0, 20000);
                  }
                  sp.edit().putString("found", name + "\n" + old).apply();
              }

              // ------------------------------------------------------------------ name generator
              static String gen(Random r, int mask) {
                  int n = Integer.bitCount(mask);
                  if (n == 0) {
                      return null;
                  }
                  int pick = r.nextInt(n);
                  int kind = 0;
                  for (int i = 0; i < 6; i++) {
                      if ((mask & (1 << i)) != 0) {
                          if (pick == 0) {
                              kind = i;
                              break;
                          }
                          pick--;
                      }
                  }
                  String d = "0123456789", l = "abcdefghijklmnopqrstuvwxyz", a = d + l;
                  switch (kind) {
                      case 0:
                          return pick(r, d, 4);
                      case 1:
                          return pick(r, d, 2) + "_" + pick(r, d, 2);
                      case 2:
                          return pick(r, d, 2) + "." + pick(r, d, 2);
                      case 3:
                          return pick(r, l, 4);
                      case 4:
                          return pick(r, a, 4);
                      default:
                          return pick(r, l, 2) + "_" + pick(r, l, 2);
                  }
              }

              static String pick(Random r, String set, int n) {
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < n; i++) {
                      sb.append(set.charAt(r.nextInt(set.length())));
                  }
                  return sb.toString();
              }

              // ------------------------------------------------------------------ checking
              static int check(String name) {
                  HttpURLConnection c = null;
                  try {
                      c = (HttpURLConnection) new URL("https://www.tiktok.com/@" + name).openConnection();
                      c.setRequestProperty("User-Agent", UA);
                      c.setRequestProperty("Accept-Language", "en-US,en;q=0.9");
                      c.setConnectTimeout(10000);
                      c.setReadTimeout(10000);
                      int code = c.getResponseCode();
                      if (code == 429 || code == 403 || code == 407) {
                          return BLOCKED;
                      }
                      InputStream in = code >= 400 ? c.getErrorStream() : c.getInputStream();
                      String body = in == null ? "" : read(in);
                      String low = body.toLowerCase(Locale.US);
                      if (low.contains("captcha") || low.contains("verify to continue")) {
                          return BLOCKED;
                      }
                      if (body.contains("\"statusCode\":10202")) {
                          return FREE;
                      }
                      if (code == 404) {
                          return FREE;
                      }
                      if (code == 200) {
                          if (body.contains("\"uniqueId\":\"") || body.contains("\"statusCode\":0")
                                  || body.contains("\"statusCode\":10221") || body.contains("\"statusCode\":10222")) {
                              return TAKEN;
                          }
                      }
                      return UNKNOWN;
                  } catch (Throwable t) {
                      return UNKNOWN;
                  } finally {
                      if (c != null) {
                          c.disconnect();
                      }
                  }
              }

              static String read(InputStream in) throws Exception {
                  BufferedReader br = new BufferedReader(new InputStreamReader(in, "UTF-8"));
                  StringBuilder sb = new StringBuilder();
                  char[] buf = new char[8192];
                  int n;
                  while ((n = br.read(buf)) > 0 && sb.length() < 400000) {
                      sb.append(buf, 0, n);
                  }
                  br.close();
                  return sb.toString();
              }

              // returns null on success, else a short error text
              static String send(String token, String chat, String text) {
                  HttpURLConnection c = null;
                  try {
                      if (token.length() == 0 || chat.length() == 0) {
                          return "missing token or id";
                      }
                      c = (HttpURLConnection) new URL("https://api.telegram.org/bot" + token + "/sendMessage").openConnection();
                      c.setRequestMethod("POST");
                      c.setDoOutput(true);
                      c.setConnectTimeout(10000);
                      c.setReadTimeout(10000);
                      byte[] data = ("chat_id=" + URLEncoder.encode(chat, "UTF-8") + "&text=" + URLEncoder.encode(text, "UTF-8")).getBytes("UTF-8");
                      c.setRequestProperty("Content-Type", "application/x-www-form-urlencoded");
                      OutputStream os = c.getOutputStream();
                      os.write(data);
                      os.close();
                      int code = c.getResponseCode();
                      if (code == 200) {
                          return null;
                      }
                      InputStream in = c.getErrorStream();
                      String body = in == null ? "" : read(in);
                      return code + " " + (body.length() > 120 ? body.substring(0, 120) : body);
                  } catch (Throwable t) {
                      return "" + t;
                  } finally {
                      if (c != null) {
                          c.disconnect();
                      }
                  }
              }
          }
